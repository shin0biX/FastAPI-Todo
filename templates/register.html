{% extends 'layout.html' %}

{% block content %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 85px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
    }
    .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 720px;
        overflow: hidden;
    }
    .auth-header {
        padding: 1.75rem 1.5rem 0;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
    }
    .auth-body { padding: 1.5rem; }
    .auth-footer {
        padding: 1rem 1.5rem 1.5rem;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
        background: #f1f5f9;
    }
    .auth-footer a {
        color: var(--primary);
        font-weight: 500;
        text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.25rem;
    }
    .full-width { grid-column: span 2; }
    .form-group { margin-bottom: 0; }
    .form-label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.4rem;
        color: var(--text);
        font-size: 0.95rem;
    }
    .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        font-size: 0.95rem;
        transition: all var(--transition);
        outline: none;
    }
    .form-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #fff;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        width: 100%;
        display: block;
        text-align: center;
        margin-top: 0.5rem;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    @media (max-width: 640px) {
        .form-grid { grid-template-columns: 1fr; }
        .full-width { grid-column: span 1; }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">Create Account</div>
        <div class="auth-body">
            <form id="registerForm" class="form-grid">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-input" name="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" name="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" name="firstname" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" name="lastname" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-input" name="role" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-input" name="phone_number" autocomplete="phone_number" required>
                </div>
                <div class="form-group full-width">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" name="password" autocomplete="new-password" required>
                </div>
                <div class="form-group full-width">
                    <label class="form-label">Verify Password</label>
                    <input type="password" class="form-input" name="password2" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
        <div class="auth-footer">
            Already have an account? <a href="/auth/login-page">Login</a>
        </div>
    </div>
</div>
{% endblock %}
